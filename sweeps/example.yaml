# Example sweep: TopK sparsity (k) x learning rate on the 4096-wide baseline, two seeds each.
# Run:  uv run python -m ptm_sae.training.sweep --spec sweeps/example.yaml --max-parallel 3
# Preview the commands first with --dry-run. Re-running resumes: finished runs are skipped,
# interrupted ones continue from their latest checkpoint.

base_config: configs/train_topk_baseline.yaml   # every run starts from this config
group: topk_k_lr                                # W&B group + sweep directory name
tags: [ablation-phase2]                         # extra W&B tags (the launcher adds "sweep" and the group)
max_parallel: 3                                 # concurrent runs; pick it with --benchmark, not by guessing

# 1. Cartesian product: every combination of these (dotted keys reach nested config fields)
grid:
  k: [16, 32, 64]
  learning_rate: [0.0004, 0.001]

# 2. Optional: cross every run with these seeds (same seed = same data order across runs)
seeds: [0, 1]

# 3. Optional: explicit extra runs, e.g. a different architecture for comparison
runs:
  - name: batchtopk_k32
    set: {sae_type: batchtopk, k: 32}
