[project]
name = "ptm-sae-engine"
version = "0.1.0"
description = "Modular Sparse Autoencoders for PTM Mechanistic Interpretability in Protein Language Models"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.2",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "scipy>=1.17.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptm_sae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
