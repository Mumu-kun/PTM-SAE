# TopK SAE baseline — ESM-2 650M, Layer 24 (d_in=1280), discovery_train.
# Recipe follows Gao et al., 2024 (OpenAI): plain Adam-family optimizer, constant LR, no grad
# clipping at this scale, no sparsity loss term (k enforces sparsity structurally).

sae_type: topk
d_in: 1280
d_hidden: 4096
k: 32

# Measured on real Kaggle GPU session: 62,093 tok/s at width=4096, k=64 (this run uses k=32,
# should be similar or slightly faster). ~5.08M discovery_train tokens / batch_size below ≈
# ~1,240 steps/epoch ≈ 82s/epoch. 24,000 steps ≈ 20 epochs ≈ ~26 min training time — a first
# look, not a final number; extend if val_mse/explained_variance are still improving at the end.
total_steps: 24000
learning_rate: 0.0004
batch_size: 4096
dtype: fp32
seed: 0

dead_latent_window_tokens: 500000
eval_interval_steps: 2000
checkpoint_dir: checkpoints/topk_k32_w4096
save_all_checkpoints: false

cache_dir: cache/activations/esm2_650m_l24
remote_repo_id: mustafa-muhaimin/ptm-sae-dataset
remote_subpath: activations/esm2_t33_650M_UR50D/layer_24
corpus_dir: data/processed
remote_corpus_subpath: corpus
num_workers: 0
shuffle_buffer_size: 65536

wandb:
  enabled: false
  project: ptm-sae
  run_name: topk_k32_w4096
