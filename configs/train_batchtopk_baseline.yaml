# BatchTopK SAE baseline — ESM-2 650M, Layer 24 (d_in=1280), discovery_train.
# Recipe follows Bussmann, 2024: plain constant LR (same rationale as TopK), AuxK on by
# default (auxk_coefficient left unset here -> BatchTopKSAEConfig's own 1/32 default applies),
# batch-level top-k budget instead of a fixed per-residue k.

sae_type: batchtopk
d_in: 1280
d_hidden: 4096
k: 32
threshold_ema_decay: 0.99

# Same corpus-scale reasoning as train_topk_baseline.yaml: not separately re-benchmarked for
# BatchTopK, but its selection mechanism is a cheap variant of TopK's, so should be comparable.
total_steps: 24000
learning_rate: 0.0004
batch_size: 4096
dtype: fp32
seed: 0

dead_latent_window_tokens: 500000
eval_interval_steps: 500
checkpoint_dir: checkpoints/batchtopk_k32_w4096
save_all_checkpoints: false

# Tier 3 Residue Collapse canary: ptm_sites.jsonl exists (data/processed/, and via the remote
# HF dataset fallback for Kaggle).
enable_collapse_check: true
collapse_check_interval_steps: 2000

# Residue-Dominance Gate canary — needs only residue identity (no PTM labels), so it's cheaper
# than the Tier 3 check above. Shares its cadence (collapse_check_interval_steps).
enable_residue_dominance_check: true

cache_dir: cache/activations/esm2_650m_l24
remote_repo_id: mustafa-muhaimin/ptm-sae-dataset
remote_subpath: activations/esm2_t33_650M_UR50D/layer_24
corpus_dir: data/processed
remote_corpus_subpath: corpus
num_workers: 0
shuffle_buffer_size: 65536

wandb:
  enabled: true
  project: ptm-sae
  run_name: batchtopk_k32_w4096
  tags: [ablation-phase2, batchtopk]
